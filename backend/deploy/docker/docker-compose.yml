services:
  research-agent:
    build:
      context: ../../../
      dockerfile: backend/deploy/docker/Dockerfile
    container_name: green-panorama-research
    restart: always
    env_file:
      - ../../../backend/.env
    volumes:
      - research-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  event-daemon:
    build:
      context: ../../../
      dockerfile: backend/deploy/docker/Dockerfile
    container_name: green-panorama-event-daemon
    entrypoint: ["python3", "-m", "agents.event_daemon"]
    restart: always
    env_file:
      - ../../../backend/.env
    volumes:
      - event-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  outbound-api:
    build:
      context: ../../../
      dockerfile: backend/deploy/docker/Dockerfile
    container_name: green-panorama-outbound-api
    entrypoint: ["python3", "-m", "uvicorn"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always
    env_file:
      - ../../../backend/.env
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  health-monitor:
    build:
      context: ../../../
      dockerfile: backend/deploy/docker/Dockerfile
    container_name: green-panorama-health-monitor
    entrypoint: ["python3", "-m", "agents.health_monitor"]
    command: ["--interval", "1800", "--unstick"]
    restart: always
    env_file:
      - ../../../backend/.env
    volumes:
      - health-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  research-data:
  event-data:
  health-data:
